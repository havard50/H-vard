# Static site — open index.html at repo root
#
# --- Manual upload to one.com (or any static host) ---
# Why Netlify can look "complete" but one.com not: Netlify always deploys 100% of the folder in one go;
# manual upload often misses hidden .htaccess, assets/.htaccess, nested assets/images/*, or leaves an old
# content.json / styles.css. Run: npm run deploy:check
# Upload the same tree Netlify publishes: index.html, shop.html, admin.html,
# robots.txt, sitemap.xml, .htaccess, and the ENTIRE assets/ folder
# (including assets/.htaccess — helps one.com/Apache not cache content.json for months). Replace the whole
# assets/ folder when content.json / CSS / JS / images change — avoids mixed versions.
# Contact: on Netlify hosts, Netlify Forms apply. On one.com etc., empty contactForm.action
# uses a free mailto: handoff (see main.js). Optional paid/free-trial providers only if you set action.
#
# Cache-Control blocks below apply on Netlify only; one.com and other hosts use their own cache rules.
#
[build]
  publish = "."

# Fresh content.json for visitors and editors; longer cache for hashed-looking static assets.
[[headers]]
  for = "/assets/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
